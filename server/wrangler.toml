# Wattómetro API (Cloudflare Workers + D1, free plan). It has no public address: the `app`
# Worker forwards /v1/* to it (server/src/gateway.ts): one origin, no CORS.
# Setup (done once; kept here for a new installation):
#   pnpm exec wrangler login
#   CLOUDFLARE_ACCOUNT_ID=<account> pnpm exec wrangler d1 create wattometro --jurisdiction eu   # data stays in the EU
#   pnpm db:migrate:remote
#   pnpm deploy:server
name = "api"
main = "src/worker.ts"
# Wattómetro's own Cloudflare account (never Faturómetro's): the login on this machine sees several.
account_id = "0fcf1ed22512b5ad46f39cf8eb61d82f"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "wattometro"
database_id = "78e9cd53-083e-4120-9abf-604eaf9bbae3" # created with --jurisdiction eu
migrations_dir = "migrations"

[vars]
# Other origins allowed to call the API (comma-separated); the app itself is same-origin.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
# Requests per minute a Shelly may send to /v1/ingest (it sends several while catching up).
INGEST_REQUESTS_PER_MINUTE = "20"
# Retention in days: minutes (readings_1m) and per-second values (readings_1s).
RETENTION_1M_DAYS = "730"
RETENTION_1S_DAYS = "90"
# D1 size limit on the free plan; the app warns near it.
DATABASE_LIMIT_MB = "500"
# Rows read per UTC day on the free plan; past it D1 refuses reads until midnight UTC.
ROWS_READ_LIMIT = "5000000"
# Web Push alerts (docs/alerts.md): contact for the push services. VAPID_PUBLIC_KEY goes
# here too (it is public); the private key is a secret (wrangler secret put VAPID_PRIVATE_KEY).
VAPID_SUBJECT = "mailto:wattometro@outlook.com"
VAPID_PUBLIC_KEY = "BLf-NqBqEYR8G6YN4tEzrvrPL_g4Bkq9sKKDaibw2b0icmYJfcn_VYigkbCPnYRNzmiw_LkWf390DbA-ysFoeJQ"

# Rollups (minutes → 15 min → day), retention and database size: server/src/rollups.ts.
[triggers]
crons = ["*/5 * * * *"]
