# The app (static PWA) on Cloudflare: https://app.wattometro.workers.dev
# Deploy: pnpm deploy:app (builds first). The API has its own configuration in server/wrangler.toml.
name = "app"
# Wattómetro's own Cloudflare account (never Faturómetro's): the login on this machine sees several.
